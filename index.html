<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ProfileUp</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f9fb;--card:#fff;--tx:#0f2a3d;--mu:#5b7080;--ac:#014976;--on:#fff;--am:#FBAE42;--bd:#e1e8ee;--g:#1e9e63;--y:#d98a0b;--r:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--card:#15232f;--tx:#e8eef3;--mu:#9bb0bf;--ac:#6bb6ea;--on:#0e1a24;--bd:#26394a;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Cairo,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:8px 16px}
.logo{background:#fff;border-radius:10px;padding:3px;height:44px}.sp{flex:1}.brand{font-weight:700;color:var(--ac);font-size:18px}
main{max-width:920px;margin:0 auto;padding:24px 16px 48px}h1{font-size:30px;line-height:1.3;margin:0 0 8px}h2{font-size:21px;margin:28px 0 12px}h3{font-size:17px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}.mu{color:var(--mu)}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
button,.btn{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}.goal{text-align:start;width:100%;padding:14px 16px;border-radius:14px}.goal:hover,.goal.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
label{display:block;font-weight:600;margin:14px 0 4px}input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}textarea{min-height:90px}
.err{color:var(--r);margin:10px 0}.warn{background:rgba(251,174,66,.18);border:1px solid var(--am);border-radius:12px;padding:10px 14px;margin:12px 0}
.row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
.crit{display:grid;grid-template-columns:minmax(110px,170px) 1fr 54px;gap:10px;align-items:center;width:100%;margin:6px 0;text-align:start;padding:8px 12px}.crit.on{border-color:var(--ac)}
.chip{padding:2px 10px;border-radius:99px;font-size:13px;color:#fff}.strong{background:var(--g)}.partial{background:var(--y)}.missing{background:var(--r)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:top}.tbl{overflow-x:auto}
.spin{width:44px;height:44px;border:5px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:s 1s linear infinite;margin:24px auto}@keyframes s{to{transform:rotate(360deg)}}
.pg{height:6px;background:var(--bd);border-radius:4px;margin-bottom:20px}.pg i{display:block;height:100%;background:var(--am);border-radius:4px}
.hero{background:linear-gradient(135deg,#014976,#0b6bab);color:#fff;border:0}.hero .mu{color:#dbe9f3}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}.kpi{background:var(--card);border:1px solid var(--bd);border-top:5px solid;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}.kpi b{font-size:30px;line-height:1.2}.only-print{display:none}footer{text-align:center;padding:20px}
@media print{header,.row,.noprint{display:none}.only-print{display:block}.screen-only{display:none}body{background:#fff}}
</style></head><body>

function radar(r){const ks=CR.filter(k=>r.criteria[k].score!==null),n=ks.length;if(n<3)return"";const C=130,R=95,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[C+R*v/100*Math.cos(a),C+R*v/100*Math.sin(a)]};const rg=[25,50,75,100].map(v=>`<polygon points="${ks.map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="var(--bd)"/>`).join("");const poly=ks.map((k,i)=>pt(i,r.criteria[k].score).join(",")).join(" ");const lab=ks.map((k,i)=>{const[x,y]=pt(i,118);return`<text x="${x}" y="${y}" font-size="9" text-anchor="middle" fill="currentColor">${nm(k).split(" ")[0]}</text>`}).join("");return`<svg viewBox="0 0 260 260" width="100%" style="max-width:340px">${rg}<polygon points="${poly}" fill="rgba(251,174,66,.35)" stroke="var(--am)" stroke-width="2"/>${ks.map((k,i)=>{const[x,y]=pt(i,r.criteria[k].score);return`<circle cx="${x}" cy="${y}" r="4" fill="${col(r.criteria[k].score)}"/>`}).join("")}${lab}</svg>`}
function dash(r){const as=CR.filter(k=>r.criteria[k].score!==null),srt=(a,b)=>r.criteria[b].score-r.criteria[a].score,top=[...as].sort(srt)[0],low=[...as].sort(srt).reverse()[0],al=r.alignment&&r.alignment.score,K=(l,v,c,s)=>`<div class="kpi" style="border-top-color:${c}"><small class="mu">${l}</small><b style="color:${c}">${v}</b><small class="mu">${s||""}</small></div>`,na=typeof al==="number";return`<div class="kpis">${K(t("score"),r.overall??"—",r.overall==null?"var(--mu)":col(r.overall),"/100")}${K(t("cover"),r.cov+"%",r.cov>=80?"var(--g)":"var(--y)",as.length+"/11")}${K(t("align"),na?Math.round(al):"—",na?col(al):"var(--mu)","/100")}${top?K(t("kBest"),r.criteria[top].score,"var(--g)",nm(top)):""}${low?K(t("kGrow"),r.criteria[low].score,"var(--y)",nm(low)):""}</div><div class="grid g2" style="margin-top:12px"><div class="card" style="text-align:center"><h3>${t("kRadar")}</h3>${radar(r)}</div><div class="card"><h3>🏆 ${t("kAch")}</h3>${(r.achievements||[]).length?`<ul>${r.achievements.map(x=>`<li>${e(x)}</li>`).join("")}</ul>`:`<p class="mu">${t("kNoAch")}</p>`}${(r.kpis||[]).length?`<h3 style="margin-top:14px">📊 ${t("kAn")}</h3><div class="kpis">${r.kpis.map((x,i)=>K(e(x.label),e(x.value),["var(--ac)","var(--am)","var(--g)","var(--y)"][i%4],e(x.note))).join("")}</div>`:""}</div></div>`}
const bp=()=>{const F=S.f,ans=Object.keys(F).filter(k=>!["url","paste"].includes(k)&&F[k]).map(k=>`${T.en["q_"+k]}: ${F[k]}`).join("\n");return`You are a careful LinkedIn career coach. The participant is new to LinkedIn or their profile is empty, so DO NOT score anything. Build a profile blueprint from ONLY the evidence below. Never invent experience, achievements, certifications, skills or numbers; where a detail is missing write a placeholder like [add your number]. Write in ${S.lang==="ar"?"Arabic (natural, suitable for Egypt and the Arab region)":"English"}.\nGOAL: ${T.en[S.goal]}\nANSWERS:\n${ans}\nCV TEXT:\n${S.pdfText.slice(0,9000)||"none"}\nPASTED TEXT:\n${(F.paste||"none").slice(0,9000)}\nReply with JSON only, no markdown: {"blueprint":{"headlines":["3 options"],"about":"draft using only supplied facts","skills":["8-12 skills supported by the evidence or the target role"],"experience":[{"role":"","bullets":["truthful achievement-oriented bullets, placeholders for missing numbers"]}],"featured":["project or portfolio ideas"],"posts":["5 first-post ideas matched to the goal"],"connect":["types of people to connect with first"]},"alignment":{"score":null,"rows":[{"req":"","evidence":"","status":"strong|partial|missing","action":""}]},"plan":{"quick":[],"short":[],"long":[]},"achievements":["quantified achievements actually found; empty list if none"]}. Give 5-8 alignment rows and 3 plan items per list.`};
function build(r){const b=r.blueprint,al=r.alignment||{rows:[]},L=a=>`<ul>${(a||[]).map(x=>`<li>${e(x)}</li>`).join("")}</ul>`,C=(i,c,h)=>`<div class="card" style="border-top:5px solid ${c}"><h3>${i} ${h}</h3>`,k4=["var(--ac)","var(--am)","var(--g)","var(--y)"];return`<div class="card hero"><h1 style="font-size:24px">🚀 ${t("bpT")}</h1><p class="mu">${t("bpNote")}</p></div><div class="grid g2" style="margin-top:12px">${C("✍️",k4[0],t("bpHead"))}${L(b.headlines)}</div>${C("📝",k4[1],t("bpAbout"))}<p>${e(b.about)}</p></div>${C("🧰",k4[2],t("bpSkills"))}${L(b.skills)}</div>${C("💼",k4[3],t("bpExp"))}${(b.experience||[]).map(x=>`<p><b>${e(x.role)}</b></p>${L(x.bullets)}`).join("")}</div>${C("⭐",k4[0],t("bpFeat"))}${L(b.featured)}</div>${C("📣",k4[1],t("bpPosts"))}${L(b.posts)}</div>${C("🤝",k4[2],t("bpConn"))}${L(b.connect)}</div>${(r.achievements||[]).length?C("🏆",k4[3],t("kAch"))+L(r.achievements)+"</div>":""}</div><h2>${t("align")}</h2><div class="card tbl"><table><tr><th>${t("req")}</th><th>${t("ev")}</th><th>${t("st")}</th><th>${t("act")}</th></tr>${(al.rows||[]).map(x=>{const s=["strong","partial","missing"].includes(String(x.status).toLowerCase())?String(x.status).toLowerCase():"partial";return`<tr><td>${e(x.req)}</td><td>${e(x.evidence)}</td><td><span class="chip ${s}">${t(s)}</span></td><td>${e(x.action)}</td></tr>`}).join("")}</table></div><h2>${t("plan")}</h2><div class="grid g2">${["quick","short","long"].map(k=>`<div class="card"><h3>${t(k)}</h3>${L((r.plan||{})[k])}</div>`).join("")}</div><div class="row"><button class="pri" data-a="print">${t("print")}</button><button data-a="again">${t("again")}</button></div>`}
let pdfP;const loadPdf=()=>pdfP||(pdfP=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok()};s.onerror=no;document.head.appendChild(s)}));
async function readPdf(f){await loadPdf();const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let s="";for(let i=1;i<=Math.min(d.numPages,8);i++){const c=await(await d.getPage(i)).getTextContent();s+=c.items.map(x=>x.str).join(" ")+"\n"}return s.trim()}
async function analyse(){S.step=4;S.fail=null;render();const w=weights(S.goal),F=S.f,ans=Object.keys(F).filter(k=>!["url","paste"].includes(k)&&F[k]).map(k=>`${T.en["q_"+k]}: ${F[k]}`).join("\n");
const p=`You are a careful LinkedIn profile auditor and career coach. Audit ONLY the evidence below against the participant's goal and target role. Write all explanations in ${S.lang==="ar"?"Arabic (natural, suitable for Egypt and the wider Arab region)":"English"}; quote evidence in its original language. Never invent experience, achievements, certifications or skills. If a section has no evidence in the text, set its score to null (never 0). ${S.shots&&S.shots.profile?"Screenshots are attached, in this order: "+Object.keys(S.shots).join(", ")+" (profile=top of profile, activity=posts tab, network=connection counts, dash=LinkedIn analytics). Assess photo and banner only from what is visible: professional impression for the goal, clarity, relevance; never looks, age, ethnicity or gender. Read visible text (headline, post content, counts, analytics numbers) as evidence and use only numbers actually visible.":"No profile-top screenshot was provided: set photo and banner score to null."}${S.shots&&!S.shots.profile?" Screenshots attached, in this order: "+Object.keys(S.shots).join(", ")+"; use only what is visible.":""} Score network/posts/featured only if the text contains evidence. Distinguish observed facts from interpretation and missing evidence ("not found in supplied information" is not "lacks the skill"). Adapt target-role requirements to the role, experience level and any job description (e.g. Project Manager: planning, stakeholders, risk, outcomes, tools; L&D specialist: facilitation, learning design, evaluation, learner impact).
GOAL: ${T.en[S.goal]}
ANSWERS:\n${ans}\nLINKEDIN URL (not fetched): ${F.url||"none"}
CV TEXT:\n${S.pdfText.slice(0,9000)||"none"}\nPASTED PROFILE TEXT:\n${(F.paste||"none").slice(0,9000)}
Reply with JSON only, no markdown: {"criteria":{"photo":C,"banner":C,"headline":C,"about":C,"exp":C,"skills":C,"featured":C,"edu":C,"posts":C,"network":C,"align":C},"alignment":{"score":0-100,"rows":[{"req":"","evidence":"","status":"strong|partial|missing","action":""}]},"strengths":["3 criterion ids"],"priorities":[{"id":"","title":"","detail":""}],"plan":{"quick":[],"short":[],"long":[]},"headlines":["3 options"],"about":"draft using only supplied facts","achievements":["quantified achievements actually found in the evidence; empty list if none"],"kpis":[{"label":"","value":"","note":""}]}. kpis = numbers visible in analytics/network screenshots only (empty list if none) where C={"score":0-100 or null,"confidence":"high|medium|low","reason":"","evidence":"","working":"","missing":"","why":"","fix":"","example":""}. Give 5-8 alignment rows and 3 items per plan list.`;
try{const im=await Promise.all(Object.values(S.shots||{}).map(bl=>new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result.split(",")[1]);fr.readAsDataURL(bl)})));const rs=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:S.newbie?bp():p,images:im})});if(!rs.ok)throw new Error("Service error "+rs.status);const r=(await rs.json()).result;if(S.newbie){if(!r||!r.blueprint)throw new Error("Unexpected response");r.build=true;S.res=r;S.step=5;render();scrollTo(0,0);return}if(!r||!r.criteria)throw new Error("Unexpected response");calc(r,w);S.res=r;S.sel=null;S.step=5;render();scrollTo(0,0)}catch(x){S.fail=x.message||x.code||"error";render()}}
document.addEventListener("input",x=>{const k=x.target.dataset.k;if(k)S.f[k]=x.target.value});

document.addEventListener("click",x=>{const b=x.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;S.err="";
if(a==="lang"){S.lang=S.lang==="ar"?"en":"ar"}else if(a==="start")S.step=1;else if(a==="goal"){S.goal=b.dataset.v;S.step=2}

else if(a==="run"){const u=(S.f.url||"").trim();const sh=Object.keys(S.shots||{}).length;if(S.newbie){if(!S.pdfText&&!(S.f.paste||"").trim())S.err="needCv"}else{if(!u&&!S.pdfText&&!sh)S.err=S.f.paste?"":"need1";if(u&&!okUrl(u))S.err="urlBad";if(!S.err&&!S.pdfText&&!sh&&!(S.f.paste||"").trim())S.err="urlNote"}if(!S.err&&!S.consent)S.err="needC";if(S.err||(!S.err&&S.step===4&&false)){S.step=3}else{S.step=4;return analyse()}}
render()});
